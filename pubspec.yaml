name: hontudy
description: "플러터 개인 프로젝트 입니다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.4.0
  flutter_launcher_icons: ^0.14.4
  auth_buttons: ^3.0.3
  flutter_gen_ai_chat_ui: ^2.15.0
  smooth_page_indicator: ^3.0.0
  flutter_highlight: ^0.7.0
  google_fonts: ^8.2.1
  freezed: ^4.0.1
  freezed_annotation: ^3.1.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  result_dart: ^2.2.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  dart_openai: ^8.0.0
  dio: ^5.11.1
  flutter_dotenv: ^6.0.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  cloud_firestore: ^6.10.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  flutter_svg: ^2.0.0

dependency_overrides:
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/hontudy_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/hontudy_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/mascot/
    - assets/topic/
    - assets/test.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900